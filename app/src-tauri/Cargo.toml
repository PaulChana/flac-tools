[package]
name = "flac-tools"
version = "1.0.0"
description = "Browse and edit FLAC metadata"
authors = ["Paul Chana"]
edition = "2021"

[lib]
name = "flac_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
metaflac = "0.2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
notify-debouncer-mini = "0.7.0"
trash = "5.2.9"

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSOperation", "NSString", "NSGeometry", "block2"] }
